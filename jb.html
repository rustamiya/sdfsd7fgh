<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>★ By Yasir Aliraqi ★ 009647890195095 ★</title>
    <!-- Self-contained stylesheet keeping subresource allocations to zero for payload stability -->
    <style>
      :root {
        --bg-dark: #07090e;
        --bg-card: rgba(15, 23, 42, 0.75);
        --bg-sunk: #0a0e17;
        --border-glow: rgba(56, 189, 248, 0.25);
        --border-subtle: rgba(255, 255, 255, 0.08);
        
        --text-main: #f1f5f9;
        --text-dim: #94a3b8;
        --text-faint: #475569;
        
        --cyan-glow: #00f0ff;
        --blue-accent: #3b82f6;
        --ok: #10b981;
        --bad: #ef4444;
        --warn: #f59e0b;
        
        --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', Consolas, "Fira Code", "DejaVu Sans Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--bg-dark);
        background-image: 
          radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 70%),
          radial-gradient(circle at 80% 90%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        color: var(--text-main);
        font: 14px/1.5 var(--font-sans);
        overflow-x: hidden;
      }

      /* Header Bar */
      #brand {
        padding: 12px 16px;
        background: rgba(11, 15, 25, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-glow);
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      #brand b {
        color: var(--cyan-glow);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      }

      /* RAM Stats Monitor Box */
      #ramBox {
        overflow: hidden;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-sunk);
        color: var(--ok);
        font: 12px/1.4 var(--font-mono);
        text-overflow: ellipsis;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
      }

      #ramBox::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 8px var(--ok);
        animation: pulse 1.5s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }

      /* Dual-Ring Cyberpunk Spinner */
      #spin {
        position: fixed;
        top: calc(50% + 15px);
        left: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border: 3px solid rgba(0, 240, 255, 0.1);
        border-top-color: var(--cyan-glow);
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      }

      #spin::after {
        content: "";
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 2px solid transparent;
        border-bottom-color: var(--blue-accent);
        border-radius: 50%;
        animation: spin-reverse 1.2s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes spin-reverse {
        to { transform: rotate(-360deg); }
      }

      /* Status Display Message */
      #msg {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
        padding: 24px 36px;
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-glow);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        max-width: 90vw;
        width: 420px;
      }

      #state, #out {
        display: none;
      }

      body.done #spin,
      body.fail #spin {
        display: none;
      }

      body.fail #msg {
        display: block;
        color: var(--bad);
        border-color: rgba(239, 68, 68, 0.4);
        box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
      }

      body.done #msg {
        display: block;
        color: var(--ok);
        border-color: rgba(16, 185, 129, 0.4);
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        font-weight: 700;
        letter-spacing: 1.5px;
      }

      /* Detailed Step Log View (?log=1) */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      body.log #spin,
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 20px;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
      }

      body.log #state {
        display: block;
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 700;
        color: var(--cyan-glow);
        letter-spacing: 0.5px;
      }

      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 20px;
        border: 1px solid var(--border-glow);
        border-radius: 12px;
        background: var(--bg-sunk);
        color: var(--text-main);
        font: 13px/1.6 var(--font-mono);
        white-space: pre-wrap;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
      }

      /* Retry Notice Banner */
      .notice {
        margin: 1.5em 0;
        padding: 1em 1.2em;
        border: 1px solid rgba(239, 68, 68, 0.5);
        border-radius: 10px;
        background: rgba(239, 68, 68, 0.12);
        color: #fca5a5;
        font: 600 16px/1.5 var(--font-sans);
        box-shadow: 0 4px 15px rgba(239, 68, 68, 0.15);
      }

      /* Footer Byline */
      .byline {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        color: var(--text-faint);
        font: 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        pointer-events: none;
        white-space: nowrap;
      }

      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .warn { color: var(--warn); }
      code {
        color: var(--cyan-glow);
        background: rgba(0, 240, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: var(--font-mono);
      }

      /* Custom Modern Scrollbar for logs */
      #out::-webkit-scrollbar {
        width: 8px;
      }
      #out::-webkit-scrollbar-track {
        background: var(--bg-sunk);
      }
      #out::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      #out::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 240, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><b>★ By Yasir Aliraqi ★ 009647890195095 ★</b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">أعد تشغيل جهاز الألعاب الخاص بك</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">★ By Yasir Aliraqi ★ 009647890195095 ★</p>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
